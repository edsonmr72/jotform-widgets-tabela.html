<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget - Tabela dinâmica (Imagem)</title>

  <!-- Leitura local de XLSX/CSV. html2canvas gera a imagem;
       JotFormCustomWidget mantem a integracao existente com o formulario. -->
  <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=Ch27tTTgeYzn28_T4YadZlIMRR0dn648ntk9Ubyd0QzCTEm9mblnj1aPXfKs-471XDSqx_XOK1Px81co1TPaMj_T8FViZp6qEF8sO_0HhHtDoP6wzF3Griy0zlt-w4vAlg8IIKsiYGWZ9oS3MfoqqXg88Mbag0AOfy53dtHiIWkE_QlBDl-77SG8PkSRsDVAMT34aDHFw2vZ_0_9DXFwSZMkiid5w0v29icKoTjfhTwIQKxd_apVYMU0Nyx8GOeaMOsLEv9VB1aIMrfIpE1M1Nwifm_BTl_89zUJFzkS4M8" charset="UTF-8"></script><link rel="stylesheet" crossorigin="anonymous" href="https://gc.kis.v2.scr.kaspersky-labs.com/E3E8934C-235A-4B0E-825A-35A08381A191/abn/main.css?attr=aHR0cHM6Ly9rbGFiaW4tbXkuc2hhcmVwb2ludC5jb20vcGVyc29uYWwvZXJpY2h0ZXJfa2xhYmluX2NvbV9ici9fbGF5b3V0cy8xNS9kb3dubG9hZC5hc3B4P1NvdXJjZVVybD0lMmZwZXJzb25hbCUyZmVyaWNodGVyX2tsYWJpbl9jb21fYnIlMmZEb2N1bWVudHMlMmZEb2N1bWVudG9zJTJmQ29waWxvdCUyZkNyaWFkbyUyZmluZGV4X2RpbmFtaWNvLmh0bWw"/><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

  <style>
    /* =================================================================
       ETAPA 1 — ESTILOS
       -----------------------------------------------------------------
       Mantém o visual original do widget. A tabela de CAPTURA
       (.capture-stage) usa estilos próprios, sem rolagem, sem cabeçalho
       "sticky" e com fundo branco, para gerar uma imagem limpa no PDF.
       ================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f6f8;
      --surface:      #ffffff;
      --border:       #e2e5ec;
      --border-2:     #c8cdd8;
      --text:         #000000;
      --muted:        #6b7585;
      --accent:       #1a56db;
      --accent-bg:    #eef3fd;
      --accent-dim:   #c7d9f9;
      --green:        #15803d;
      --green-bg:     #f0fdf4;
      --green-border: #bbf7d0;
      --red:          #b91c1c;
      --red-bg:       #fef2f2;
      --red-border:   #fecaca;
      --head-bg:      #666666;
      --radius:       10px;
      --shadow:       0 2px 8px rgba(0,0,0,.07);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    /* Contêiner usado para medir a altura e redimensionar o iframe */
    #widgetContent { width: 100%; }

    /* Input de arquivo oculto (acionado pela drop zone) */
    #fileIn { display: none; }

    /* Drop zone */
    .drop-zone {
      background: var(--surface);
      border: 2px dashed var(--border-2);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .18s, background .18s;
      user-select: none;
    }
    .drop-zone:hover,
    .drop-zone:focus-visible { border-color: var(--accent); background: var(--accent-bg); outline: none; }
    .drop-zone.over { border-color: var(--accent); background: var(--accent-bg); border-style: solid; }
    .dz-icon  { font-size: 36px; margin-bottom: 8px; pointer-events: none; }
    .dz-title { font-weight: 700; font-size: 14px; margin-bottom: 3px; pointer-events: none; }
    .dz-sub   { color: var(--muted); font-size: 12px; pointer-events: none; }
    .dz-sub code {
      background: var(--border); padding: 1px 6px; border-radius: 4px;
      font-family: "Courier New", monospace; font-size: 11px;
    }

    /* Utilitário */
    .hidden { display: none !important; }

    /* Mensagens de status */
    .status {
      display: none; align-items: center; gap: 8px;
      margin-top: 10px; padding: 9px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
    }
    .status.ok   { display: flex; background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .status.err  { display: flex; background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-border); }
    .status.info { display: flex; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-dim); }

    /* Barra de informações (contadores + novo arquivo) */
    .meta-bar {
      display: none; align-items: center; justify-content: space-between;
      margin-top: 12px; gap: 8px; flex-wrap: wrap;
    }
    .meta-bar.on { display: flex; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px; font-size: 11px;
      font-family: "Courier New", monospace;
    }
    .chip b { color: var(--accent); }

    /* Botões */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 8px 14px; border-radius: 7px; border: none;
      font: 700 12px/1 Arial, sans-serif; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover:not(:disabled)  { opacity: .85; transform: translateY(-1px); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-ghost   { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-primary { background: var(--accent); color: #fff; }

    /* Tabela de PRÉ-VISUALIZAÇÃO (com rolagem) */
    .tbl-wrap {
      display: none; margin-top: 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow); background: #fff;
    }
    .tbl-wrap.on { display: block; }
    .tbl-scroll { overflow: auto; max-height: 320px; }

    .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .preview-table thead th {
      background: var(--head-bg); color: #fff;
      padding: 9px 14px; text-align: left; font-weight: 700;
      font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      white-space: nowrap; position: sticky; top: 0; z-index: 2;
      border-right: 1px solid rgba(255,255,255,.15);
    }
    .preview-table tbody td {
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border); vertical-align: middle;
      font-size: 11.5px; color: #000;
    }
    .preview-table tbody tr:nth-child(even) td { background: #f8faff; }
    .preview-table td.col-fe   { font-family: "Courier New", monospace; font-weight: 700; background: #fff !important; white-space: nowrap; }
    .preview-table td.col-comp { font-family: "Courier New", monospace; }

    /* Área de confirmação */
    .action-row {
      display: none; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 12px; flex-wrap: wrap;
      background: var(--accent-bg); border: 1px solid var(--accent-dim);
      border-radius: 8px; padding: 10px 14px;
    }
    .action-row.on { display: flex; }
    .action-row span { font-size: 13px; color: var(--accent); font-weight: 600; }

    /* Pré-visualização da IMAGEM gerada / salva */
    .image-box {
      display: none; margin-top: 12px; padding: 12px;
      background: var(--surface); border: 1px solid var(--green-border);
      border-radius: var(--radius);
    }
    .image-box.on { display: block; }
    .image-box-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap; margin-bottom: 10px;
      color: var(--green); font-weight: 700;
    }
    .image-box img {
      display: block; max-width: 100%; height: auto;
      border: 1px solid var(--border); background: #fff;
    }

    /* =================================================================
       PALCO DE CAPTURA (fora da tela)
       -----------------------------------------------------------------
       A imagem é gerada a partir de uma tabela montada aqui, SEM rolagem
       e SEM limite de altura, garantindo que TODAS as linhas apareçam no
       PNG. Fica posicionada fora da área visível do usuário.
       ================================================================= */
    .capture-stage {
      position: absolute;
      left: -100000px;
      top: 0;
      background: #ffffff;
      padding: 0;
    }
    .capture-table {
      border-collapse: collapse;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      min-width: 900px;
    }
    .capture-table th {
      background: #666666; color: #ffffff;
      padding: 8px 12px; text-align: left; font-weight: 700;
      border: 1px solid #444444; font-size: 13px; white-space: nowrap;
    }
    .capture-table td {
      padding: 7px 12px; border: 1px solid #d1d5db;
      color: #000000; vertical-align: middle; font-size: 13px;
      background: #ffffff;
    }
    .capture-table td.col-fe   { font-weight: 700; white-space: nowrap; font-family: "Courier New", monospace; }
    .capture-table td.col-comp { font-family: "Courier New", monospace; }
    .capture-table td.alt      { background: #f8faff; }

    /* Colunas determinadas pelo arquivo, sem larguras ou nomes fixos. */
    .preview-table, .capture-table { table-layout: fixed; }
    .preview-table thead th, .capture-table th {
      white-space: pre-wrap; line-height: 1.3; vertical-align: middle;
      text-transform: none; letter-spacing: normal; overflow-wrap: anywhere;
    }
    .preview-table td, .capture-table td {
      white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.35;
      padding: 10px; text-align: left;
    }
    .capture-table { min-width: 0; }
  </style>
</head>

<body>
<div id="widgetContent">

  <!-- ETAPA 2 — SELEÇÃO DA PLANILHA (input oculto + drop zone) -->
  <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" />

  <div class="drop-zone" id="dz" role="button" tabindex="0"
       aria-label="Selecionar planilha">
    <div class="dz-icon">📊</div>
    <div class="dz-title">Arraste sua planilha aqui</div>
    <div class="dz-sub">ou clique para selecionar &nbsp;<code>.xlsx</code>&nbsp;<code>.xls</code>&nbsp;<code>.csv</code></div>
  </div>

  <!-- Mensagens de status (anunciadas para leitores de tela) -->
  <div class="status" id="status" aria-live="polite"></div>

  <!-- Contadores + botão de novo arquivo -->
  <div class="meta-bar" id="metaBar">
    <div class="chips" id="chips"></div>
    <button type="button" class="btn btn-ghost" id="btnReset">↩ Novo arquivo</button>
  </div>

  <!-- ETAPA 3 — PRÉ-VISUALIZAÇÃO DA TABELA -->
  <div class="tbl-wrap" id="tblWrap">
    <div class="tbl-scroll">
      <table class="preview-table">
        <thead id="previewHead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ETAPA 4 — CONFIRMAÇÃO (gera a imagem e envia ao formulário) -->
  <div class="action-row" id="actionRow">
    <span>✅ Tabela pronta — confirme para gerar a imagem e inserir no formulário.</span>
    <button type="button" class="btn btn-primary" id="btnConfirm">Gerar imagem e inserir →</button>
  </div>

  <!-- ETAPA 5 — IMAGEM GERADA OU JÁ SALVA NA SUBMISSÃO -->
  <div class="image-box" id="imageBox">
    <div class="image-box-header">
      <span id="imageBoxTitle">✔ Imagem da tabela inserida no formulário</span>
      <button type="button" class="btn btn-ghost" id="btnReplace">Substituir imagem</button>
    </div>
    <img id="imagePreview" alt="Imagem da tabela" />
  </div>

</div>

<!-- Palco de captura fora da tela (preenchido apenas no momento de gerar o PNG) -->
<div class="capture-stage" id="captureStage" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  /* ===================================================================
     ETAPA 6 — ESTADO DO WIDGET
     -------------------------------------------------------------------
     grouped      : linhas da planilha, preservadas sem agrupamento
     currentValue : valor que será enviado ao Jotform (JSON "imagelinks")
     sourceName   : nome do arquivo original (usado para nomear o PNG)
     widgetReady  : indica se o evento "ready" do Jotform já ocorreu
     =================================================================== */
  var grouped      = [];
  var columnHeaders = [];
  var currentValue = '';
  var sourceName   = '';
  var widgetReady  = false;
  var statusTimer  = null;

  /* Limites de segurança para o canvas (navegadores não suportam canvas
     gigantes; acima disso a imagem fica em branco ou gera erro). */
  var MAX_CANVAS_SIDE = 16000;
  var PREFERRED_SCALE = 2;

  /* ===================================================================
     ETAPA 7 — REFERÊNCIAS DO DOM
     =================================================================== */
  function $(id) { return document.getElementById(id); }

  var dz            = $('dz');
  var fileIn        = $('fileIn');
  var statusEl      = $('status');
  var metaBar       = $('metaBar');
  var chipsEl       = $('chips');
  var tblWrap       = $('tblWrap');
  var tbody         = $('tbody');
  var actionRow     = $('actionRow');
  var btnConfirm    = $('btnConfirm');
  var btnReset      = $('btnReset');
  var btnReplace    = $('btnReplace');
  var imageBox      = $('imageBox');
  var imageBoxTitle = $('imageBoxTitle');
  var imagePreview  = $('imagePreview');
  var captureStage  = $('captureStage');
  var widgetContent = $('widgetContent');

  /* ===================================================================
     ETAPA 8 — VERIFICA SE A API DO JOTFORM ESTÁ DISPONÍVEL
     -------------------------------------------------------------------
     Se o index.html for aberto fora do formulário (direto no navegador),
     a API não existe. O widget continua mostrando a pré-visualização,
     mas avisa que o envio só funciona dentro do Jotform.
     =================================================================== */
  function hasJotformApi() {
    return typeof window.JFCustomWidget !== 'undefined';
  }

  /* ===================================================================
     ETAPA 9 — REDIMENSIONAMENTO AUTOMÁTICO DO IFRAME
     -------------------------------------------------------------------
     Ajusta a altura do iframe ao conteúdo real do widget, conforme
     orientação do suporte (requestFrameResize).
     =================================================================== */
  var resizeTimer = null;

  function resizeWidget() {
    if (!widgetReady || !hasJotformApi()) return;

    if (resizeTimer) clearTimeout(resizeTimer);

    resizeTimer = setTimeout(function () {
      var height = Math.ceil(widgetContent.getBoundingClientRect().height) + 40;

      try {
        JFCustomWidget.requestFrameResize({ height: height });
      } catch (err) {
        /* Ignora: o redimensionamento é melhoria visual, não afeta o envio. */
      }
    }, 60);
  }

  /* Redimensiona automaticamente sempre que o conteúdo mudar de tamanho */
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resizeWidget).observe(widgetContent);
  }
  window.addEventListener('resize', resizeWidget);

  /* ===================================================================
     ETAPA 10 — MENSAGENS DE STATUS
     =================================================================== */
  function setStatus(type, message, autoHideMs) {
    if (statusTimer) clearTimeout(statusTimer);

    statusEl.className   = 'status ' + type;
    statusEl.textContent = message;

    if (autoHideMs) {
      statusTimer = setTimeout(clearStatus, autoHideMs);
    }

    resizeWidget();
  }

  function clearStatus() {
    if (statusTimer) clearTimeout(statusTimer);
    statusEl.className   = 'status';
    statusEl.textContent = '';
    resizeWidget();
  }

  /* ===================================================================
     ETAPA 11 — INTEGRAÇÃO COM O JOTFORM (ready + submit)
     -------------------------------------------------------------------
     1. "ready"  : disparado quando o formulário carrega o widget.
                   Se for edição de submissão, recebe o valor salvo e
                   exibe a imagem já armazenada.
     2. "submit" : disparado quando o usuário envia o formulário.
                   Devolve o valor "imagelinks" mais recente.
                   valid=false bloqueia o envio se o campo for obrigatório
                   e nenhuma imagem tiver sido gerada.
     =================================================================== */
  if (hasJotformApi()) {
    JFCustomWidget.subscribe('ready', function (data) {
      widgetReady = true;

      /* Recupera valor salvo (edição de submissão existente) */
      var savedValue = extractReadyValue(data);
      var savedImage = extractImageFromValue(savedValue);

      if (savedValue) {
        currentValue = savedValue;
      }

      if (savedImage) {
        showImage(savedImage, 'Imagem atualmente salva na submissão');
        dz.classList.add('hidden');
      }

      /* Handler de envio do formulário */
      JFCustomWidget.subscribe('submit', function () {
        JFCustomWidget.sendSubmit({
          value: currentValue,
          valid: Boolean(currentValue)
        });
      });

      resizeWidget();
    });
  }

  /* Extrai o valor salvo do evento "ready" (aceita formatos diferentes) */
  function extractReadyValue(data) {
    if (!data) return '';
    if (typeof data.value === 'string') return data.value;
    if (data.value && typeof data.value.value === 'string') return data.value.value;
    return '';
  }

  /* Extrai a URL (ou Base64) da imagem a partir do valor "imagelinks" */
  function extractImageFromValue(rawValue) {
    if (!rawValue) return '';

    try {
      var parsed = typeof rawValue === 'string' ? JSON.parse(rawValue) : rawValue;
      var items  = parsed && parsed.widget_metadata && parsed.widget_metadata.value;

      if (Array.isArray(items) && items[0]) {
        var item = items[0];
        if (typeof item === 'string') return item;
        return item.url || item.link || item.src || item.base64 || '';
      }
    } catch (err) {
      /* Valor salvo pode ser uma URL simples após o processamento do Jotform */
      if (/^https?:\/\//i.test(rawValue) || /^data:image\//i.test(rawValue)) {
        return rawValue;
      }
    }

    return '';
  }

  /* ===================================================================
     ETAPA 12 — SELEÇÃO DE ARQUIVO (clique, teclado e arrastar/soltar)
     =================================================================== */
  function openPicker() {
    fileIn.value = ''; /* permite selecionar o mesmo arquivo novamente */
    fileIn.click();
  }

  dz.addEventListener('click', openPicker);

  dz.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openPicker();
    }
  });

  ['dragenter', 'dragover'].forEach(function (evt) {
    dz.addEventListener(evt, function (e) {
      e.preventDefault();
      e.stopPropagation();
      dz.classList.add('over');
    });
  });

  dz.addEventListener('dragleave', function (e) {
    e.preventDefault();
    e.stopPropagation();
    var rect = dz.getBoundingClientRect();
    if (e.clientX < rect.left || e.clientX > rect.right ||
        e.clientY < rect.top  || e.clientY > rect.bottom) {
      dz.classList.remove('over');
    }
  });

  dz.addEventListener('drop', function (e) {
    e.preventDefault();
    e.stopPropagation();
    dz.classList.remove('over');
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files[0]) handleFile(files[0]);
  });

  fileIn.addEventListener('change', function () {
    if (fileIn.files && fileIn.files[0]) handleFile(fileIn.files[0]);
  });

  /* ===================================================================
     ETAPA 13 — VALIDAÇÃO E DESPACHO DO ARQUIVO
     =================================================================== */
  function handleFile(file) {
    var ext = (file.name.split('.').pop() || '').toLowerCase();

    if (['xlsx', 'xls', 'csv'].indexOf(ext) === -1) {
      setStatus('err', '⚠ Formato inválido. Use .xlsx, .xls ou .csv.');
      return;
    }

    /* Nova planilha invalida qualquer imagem anterior */
    grouped = [];
    columnHeaders = [];
    tbody.innerHTML = '';
    $('previewHead').innerHTML = '';
    tblWrap.classList.remove('on');
    actionRow.classList.remove('on');
    metaBar.classList.remove('on');
    sourceName   = file.name;
    currentValue = '';
    hideImage();
    notifyEmptyValue();

    if (ext === 'csv') {
      parseCSV(file);
    } else {
      parseXLSX(file);
    }
  }

  /* ===================================================================
     ETAPA 14 — LEITURA DA PLANILHA (somente no navegador)
     =================================================================== */
  /* Leitor NATIVO de .xlsx (sem bibliotecas externas).
     O .xlsx é um ZIP com XMLs: lê o ZIP, descompacta com
     DecompressionStream e interpreta a 1ª planilha com DOMParser. */
  function u16(d, o) { return d[o] | (d[o + 1] << 8); }
  function u32(d, o) { return (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0; }

  function readZip(buf) {
    var d = new Uint8Array(buf), eocd = -1;
    for (var i = d.length - 22; i >= Math.max(0, d.length - 66000); i--) {
      if (u32(d, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Arquivo .xlsx inválido.');
    var count = u16(d, eocd + 10), p = u32(d, eocd + 16), files = {};
    var dec = new TextDecoder('utf-8');
    for (var n = 0; n < count; n++) {
      if (u32(d, p) !== 0x02014b50) break;
      var method = u16(d, p + 10), csize = u32(d, p + 20);
      var nlen = u16(d, p + 28), xlen = u16(d, p + 30), clen = u16(d, p + 32);
      var loc = u32(d, p + 42);
      var name = dec.decode(d.subarray(p + 46, p + 46 + nlen));
      var dataStart = loc + 30 + u16(d, loc + 26) + u16(d, loc + 28);
      files[name] = { method: method, data: d.subarray(dataStart, dataStart + csize) };
      p += 46 + nlen + xlen + clen;
    }
    return files;
  }

  function unzipText(entry) {
    if (!entry) return Promise.resolve('');
    if (entry.method === 0) return Promise.resolve(new TextDecoder('utf-8').decode(entry.data));
    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject(new Error('Navegador sem suporte à leitura de .xlsx. Use Chrome/Edge atualizado ou salve como .csv.'));
    }
    var stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  }

  function xmlDoc(text) { return new DOMParser().parseFromString(text, 'application/xml'); }
  function byTag(node, tag) { return node.getElementsByTagNameNS('*', tag); }

  function colToIndex(ref) {
    var letters = (ref || '').replace(/[0-9]/g, ''), n = 0;
    for (var i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
    return n - 1;
  }

  function cellText(node) {
    var ts = byTag(node, 't'), out = '';
    for (var i = 0; i < ts.length; i++) out += ts[i].textContent;
    return out;
  }

  function parseXLSX(file) {
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'xls') {
      setStatus('err', '⚠ Formato .xls antigo não suportado. Salve a planilha como .xlsx ou .csv.');
      return;
    }

    file.arrayBuffer().then(function (buf) {
      var files = readZip(buf);

      /* Descobre o caminho da 1ª planilha pelo workbook */
      return Promise.all([
        unzipText(files['xl/workbook.xml']),
        unzipText(files['xl/_rels/workbook.xml.rels']),
        unzipText(files['xl/sharedStrings.xml'])
      ]).then(function (r) {
        var sheetPath = 'xl/worksheets/sheet1.xml';
        try {
          var firstSheet = byTag(xmlDoc(r[0]), 'sheet')[0];
          var rid = firstSheet.getAttribute('r:id') || firstSheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
          var rels = byTag(xmlDoc(r[1]), 'Relationship');
          for (var i = 0; i < rels.length; i++) {
            if (rels[i].getAttribute('Id') === rid) {
              var t = rels[i].getAttribute('Target').replace(/^\//, '');
              sheetPath = t.indexOf('xl/') === 0 ? t : 'xl/' + t;
            }
          }
        } catch (e) { /* usa sheet1.xml */ }

        var shared = [];
        if (r[2]) {
          var sis = byTag(xmlDoc(r[2]), 'si');
          for (var j = 0; j < sis.length; j++) shared.push(cellText(sis[j]));
        }

        return unzipText(files[sheetPath]).then(function (sheetXml) {
          var rowsXml = byTag(xmlDoc(sheetXml), 'row'), rows = [];
          for (var a = 0; a < rowsXml.length; a++) {
            var row = [], cells = byTag(rowsXml[a], 'c');
            for (var b = 0; b < cells.length; b++) {
              var c = cells[b], type = c.getAttribute('t'), idx = colToIndex(c.getAttribute('r'));
              if (idx < 0) idx = row.length;
              var v = byTag(c, 'v')[0], val = '';
              if (type === 's') val = shared[parseInt(v ? v.textContent : '0', 10)] || '';
              else if (type === 'inlineStr') val = cellText(c);
              else if (v) val = v.textContent;
              /* números com casas decimais longas (ex.: 0.30000000000000004) */
              if (type !== 's' && type !== 'inlineStr' && type !== 'str' && val !== '' && !isNaN(val)) {
                val = String(parseFloat(Number(val).toPrecision(12)));
              }
              while (row.length < idx) row.push('');
              row[idx] = val;
            }
            rows.push(row);
          }
          processRows(rows, file.name);
        });
      });
    }).catch(function (err) {
      setStatus('err', '⚠ Erro ao ler a planilha: ' + err.message);
    });
  }

  /* Leitor NATIVO de .csv (detecta ; ou , e respeita aspas) */
  function parseCSV(file) {
    file.text().then(function (text) {
      text = text.replace(/^\uFEFF/, '');
      var firstLine = text.split(/\r?\n/)[0] || '';
      var sep = (firstLine.split(';').length >= firstLine.split(',').length) ? ';' : ',';
      var rows = [], row = [], field = '', q = false;
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        if (q) {
          if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
          else field += ch;
        } else if (ch === '"') q = true;
        else if (ch === sep) { row.push(field); field = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(field); field = '';
          if (row.join('').trim() !== '') rows.push(row);
          row = [];
        } else field += ch;
      }
      row.push(field);
      if (row.join('').trim() !== '') rows.push(row);
      processRows(rows, file.name);
    }).catch(function (err) {
      setStatus('err', '⚠ Erro ao ler o CSV: ' + err.message);
    });
  }

  /* ===================================================================
     ETAPA 15 — IDENTIFICAÇÃO DAS COLUNAS E AGRUPAMENTO
     -------------------------------------------------------------------
     Procura as colunas pelo nome (ignorando acentos e maiúsculas).
     Se não encontrar, usa a posição padrão: A=FE, B=Referência, C=Composição.
     Agrupa as composições por FE + Referência, sem duplicatas.
     =================================================================== */
  // A primeira linha nao vazia contem os titulos; as demais sao dados.
  function processRows(rows, filename) {
    var clean = (rows || []).filter(function (row) {
      return Array.isArray(row) && row.some(function (v) {
        return v != null && String(v).trim() !== '';
      });
    });
    if (clean.length < 2) {
      setStatus('err', 'O arquivo precisa conter uma linha de cabeçalhos e pelo menos uma linha de dados.');
      return;
    }
    var count = clean.reduce(function (max, row) {
      var last = row.length;
      while (last > 0 && (row[last - 1] == null || String(row[last - 1]).trim() === '')) last--;
      return Math.max(max, last);
    }, 0);
    var headers = Array.from({ length: count }, function (_, i) {
      return clean[0][i] == null ? '' : String(clean[0][i]);
    });
    if (headers.some(function (h) { return !h.trim(); })) {
      setStatus('err', 'Há coluna com dados sem título. Preencha todos os cabeçalhos na primeira linha do arquivo.');
      return;
    }
    columnHeaders = headers;
    // Preserva todas as linhas, sem agrupamento por nomes ou posicoes fixas.
    grouped = clean.slice(1).map(function (row) {
      return columnHeaders.map(function (_, i) {
        return row[i] == null ? '' : String(row[i]);
      });
    });
    renderPreview();
    chipsEl.textContent = grouped.length + ' linha(s) | ' + columnHeaders.length + ' coluna(s)';
    setStatus('ok', filename + ' carregado com sucesso.', 5000);
    dz.classList.add('hidden');
    metaBar.classList.add('on');
    tblWrap.classList.add('on');
    actionRow.classList.add('on');
    resizeWidget();
  }

  function buildHeader(targetHead) {
    targetHead.innerHTML = '';
    var tr = document.createElement('tr');
    columnHeaders.forEach(function (title) {
      var th = document.createElement('th');
      th.scope = 'col';
      th.textContent = title;
      tr.appendChild(th);
    });
    targetHead.appendChild(tr);
  }

  function buildRows(targetTbody, useAltClass) {
    targetTbody.innerHTML = '';
    var fragment = document.createDocumentFragment();
    grouped.forEach(function (row, index) {
      var tr = document.createElement('tr');
      row.forEach(function (value) {
        var td = document.createElement('td');
        td.textContent = value;
        if (useAltClass && index % 2 === 1) td.className = 'alt';
        tr.appendChild(td);
      });
      fragment.appendChild(tr);
    });
    targetTbody.appendChild(fragment);
  }

  function tableWidth() {
    return Math.max(900, columnHeaders.length * 150);
  }

  function renderPreview() {
    buildHeader($('previewHead'));
    var table = tbody.closest('table');
    table.style.minWidth = tableWidth() + 'px';
    buildRows(tbody, false);
  }

  function buildCaptureTable() {
    captureStage.innerHTML = '';
    var table = document.createElement('table');
    table.className = 'capture-table';
    table.style.width = tableWidth() + 'px';
    var thead = document.createElement('thead');
    buildHeader(thead);
    table.appendChild(thead);
    var tb = document.createElement('tbody');
    buildRows(tb, true);
    table.appendChild(tb);
    captureStage.appendChild(table);
    return table;
  }

  function renderTableToCanvas(table) {
    var width  = Math.ceil(table.scrollWidth);
    var height = Math.ceil(table.scrollHeight);

    var scale = Math.min(
      PREFERRED_SCALE,
      MAX_CANVAS_SIDE / Math.max(width, 1),
      MAX_CANVAS_SIDE / Math.max(height, 1)
    );

    if (scale < 0.5) {
      return Promise.reject(new Error(
        'A tabela é grande demais para gerar uma única imagem legível. ' +
        'Divida a planilha em partes menores.'
      ));
    }

    if (typeof html2canvas === 'undefined') {
      return Promise.resolve(drawTableNative(table, scale));
    }

    return html2canvas(table, {
      scale: scale,
      backgroundColor: '#ffffff',
      logging: false,
      useCORS: true,
      width: width,
      height: height,
      windowWidth: width,
      windowHeight: height
    });
  }

  /* Desenho NATIVO da tabela no canvas (usado se html2canvas for bloqueado) */
  function drawTableNative(table, scale) {
    var box = table.getBoundingClientRect();
    var canvas = document.createElement('canvas');
    canvas.width  = Math.ceil(box.width * scale);
    canvas.height = Math.ceil(box.height * scale);
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, box.width, box.height);

    var cells = table.querySelectorAll('th, td');
    for (var i = 0; i < cells.length; i++) {
      var el = cells[i], r = el.getBoundingClientRect(), cs = getComputedStyle(el);
      var x = r.left - box.left, y = r.top - box.top;
      var bg = cs.backgroundColor;
      if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
        ctx.fillStyle = bg; ctx.fillRect(x, y, r.width, r.height);
      }
      ctx.strokeStyle = cs.borderTopColor || '#c8cdd8';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, r.width - 1, r.height - 1);

      ctx.fillStyle = cs.color || '#000';
      ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      ctx.textBaseline = 'top';
      var pl = parseFloat(cs.paddingLeft) || 6, pt = parseFloat(cs.paddingTop) || 4;
      var pr = parseFloat(cs.paddingRight) || 6;
      var lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.3;
      var maxW = r.width - pl - pr;

      /* quebra de linha por palavras */
      var lines = [];
      String(el.textContent).split('\n').forEach(function (para) {
        var words = para.split(' '), line = '';
        words.forEach(function (w) {
          var test = line ? line + ' ' + w : w;
          if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
          else line = test;
        });
        lines.push(line);
      });
      var textH = lines.length * lh;
      var ty = (cs.verticalAlign === 'middle') ? y + (r.height - textH) / 2 : y + pt;
      lines.forEach(function (ln, k) {
        var tx = x + pl;
        if (cs.textAlign === 'center') tx = x + (r.width - ctx.measureText(ln).width) / 2;
        ctx.fillText(ln, tx, ty + k * lh);
      });
    }
    return canvas;
  }

  /* Gera um nome de arquivo PNG seguro a partir do nome da planilha */
  function createPngName(originalName) {
    var base = String(originalName || 'tabela')
      .replace(/\.[^.]+$/, '')
      .replace(/[\\/:*?"<>|]+/g, '_')
      .trim();

    return (base || 'tabela') + '.png';
  }

  /* ===================================================================
     ETAPA 19 — MONTA O VALOR "imagelinks" E ENVIA AO JOTFORM
     -------------------------------------------------------------------
     Formato indicado pelo suporte do Jotform. Após o envio do formulário,
     o Jotform processa o Base64 e armazena a imagem na submissão,
     deixando-a disponível no PDF Editor, e-mails e relatórios.
     =================================================================== */
  function buildImageLinksValue(base64Png, fileName) {
    return JSON.stringify({
      widget_metadata: {
        type: 'imagelinks',
        value: [{
          name: null,
          base64: base64Png
        }]
      }
    });
  }

  function generateAndSend() {
    if (!grouped.length) {
      setStatus('err', '⚠ Selecione uma planilha válida primeiro.');
      return;
    }

    btnConfirm.disabled    = true;
    btnConfirm.textContent = 'Gerando imagem...';
    setStatus('info', '⏳ Gerando a imagem da tabela...');

    var table;

    try {
      table = buildCaptureTable();
    } catch (err) {
      finishWithError(err);
      return;
    }

    renderTableToCanvas(table)
      .then(function (canvas) {
        var base64Png = canvas.toDataURL('image/png');

        if (!base64Png || base64Png === 'data:,') {
          throw new Error('O navegador não conseguiu gerar a imagem.');
        }

        /* Valor final que irá para a submissão */
        currentValue = buildImageLinksValue(base64Png, createPngName(sourceName));

        if (!hasJotformApi() || !widgetReady) {
          throw new Error(
            'A API do Jotform não está ativa. Teste o widget dentro do formulário publicado.'
          );
        }

        /* Envia imediatamente ao formulário (o submit reenviará o mesmo valor) */
        JFCustomWidget.sendData({ value: currentValue, valid: true });

        /* Atualiza a interface */
        actionRow.classList.remove('on');
        tblWrap.classList.remove('on');
        showImage(base64Png, '✔ Imagem da tabela inserida no formulário');
        setStatus('ok', '✓ Imagem gerada. Agora é só enviar o formulário.', 6000);
      })
      .catch(function (err) {
        finishWithError(err);
      })
      .then(function () {
        /* Limpeza (executa sempre, com sucesso ou erro) */
        captureStage.innerHTML = '';
        btnConfirm.disabled    = false;
        btnConfirm.textContent = 'Gerar imagem e inserir →';
        resizeWidget();
      });
  }

  function finishWithError(err) {
    /* Em caso de falha, mantém a imagem gerada visível apenas se foi enviada */
    if (!hasJotformApi() || !widgetReady) {
      setStatus('err', '⚠ ' + err.message);
      return;
    }
    currentValue = '';
    notifyEmptyValue();
    setStatus('err', '⚠ Falha ao gerar ou enviar a imagem: ' + err.message);
  }

  btnConfirm.addEventListener('click', generateAndSend);

  /* ===================================================================
     ETAPA 20 — EXIBIÇÃO DA IMAGEM (gerada agora ou já salva)
     =================================================================== */
  function showImage(src, title) {
    imagePreview.src          = src;
    imageBoxTitle.textContent = title;
    imageBox.classList.add('on');
    resizeWidget();
  }

  function hideImage() {
    imageBox.classList.remove('on');
    imagePreview.removeAttribute('src');
  }

  /* Informa ao Jotform que o campo está vazio (ex.: após reset) */
  function notifyEmptyValue() {
    if (widgetReady && hasJotformApi()) {
      JFCustomWidget.sendData({ value: '', valid: false });
    }
  }

  /* ===================================================================
     ETAPA 21 — RESET / SUBSTITUIR IMAGEM
     -------------------------------------------------------------------
     Limpa tudo e volta para a seleção de planilha. O valor enviado ao
     formulário também é limpo até que uma nova imagem seja gerada.
     =================================================================== */
  function resetWidget() {
    grouped      = [];
    columnHeaders = [];
    $('previewHead').innerHTML = '';
    currentValue = '';
    sourceName   = '';
    fileIn.value = '';

    tbody.innerHTML        = '';
    chipsEl.innerHTML      = '';
    captureStage.innerHTML = '';

    clearStatus();
    hideImage();

    dz.classList.remove('hidden');
    metaBar.classList.remove('on');
    tblWrap.classList.remove('on');
    actionRow.classList.remove('on');

    notifyEmptyValue();
    resizeWidget();
  }

  btnReset.addEventListener('click', resetWidget);
  btnReplace.addEventListener('click', resetWidget);

})();
</script>
</body>
</html>
